name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Get version from tag
        id: ver
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        run: >
          dotnet publish src/pbe-pro/pbe-pro.csproj
          -c Release -r win-x64 --self-contained false
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "PBE-Pro-${{ steps.ver.outputs.version }}-win-x64.zip"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $flags = @()
          if ($env:VERSION -match '-') { $flags += '--prerelease' }
          gh release create $env:TAG "PBE-Pro-$($env:VERSION)-win-x64.zip" `
            --title "PBE-Pro $env:VERSION" --generate-notes @flags